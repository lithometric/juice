[project]
name = "juice"
version = "0.1.0"
description = "AI-driven video builder: portrait or landscape, short or long form; cuts from a JSON spec, motion graphics from a short Python script"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "requests>=2.31",
    "numpy>=1.26",
    "opencv-contrib-python>=4.8",
    "scipy>=1.11",
    "skia-python>=87.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
juice = "juice.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["juice*"]

[tool.setuptools.package-data]
juice = ["style.default.json"]
